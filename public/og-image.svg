<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo/Brand mark -->
  <g transform="translate(100, 280)">
    <!-- House/Building icon -->
    <rect x="0" y="20" width="60" height="50" rx="4" fill="#22c55e" opacity="0.9"/>
    <rect x="10" y="35" width="15" height="15" rx="2" fill="#0f172a"/>
    <rect x="35" y="35" width="15" height="15" rx="2" fill="#0f172a"/>
    <rect x="22" y="55" width="16" height="15" rx="2" fill="#0f172a"/>
    <polygon points="30,0 0,25 60,25" fill="#22c55e"/>
  </g>
  
  <!-- App name -->
  <text x="180" y="310" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="700" fill="white">
    Inmoxil
  </text>
  
  <!-- Tagline -->
  <text x="100" y="380" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#94a3b8">
    Importación y Marketing para Inmobiliarias
  </text>
  
  <!-- Features -->
  <text x="100" y="430" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#64748b">
    Scraping multi-portal • Generación de ads • CRM • Pagos
  </text>
  
  <!-- URL -->
  <text x="100" y="550" font-family="Inter, -apple-system, sans-serif" font-size="16" fill="#22c55e">
    inmoxil.com
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="80" fill="#22c55e" opacity="0.1"/>
  <circle cx="1050" cy="500" r="60" fill="#22c55e" opacity="0.08"/>
</svg>
